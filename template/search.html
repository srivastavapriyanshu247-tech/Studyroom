{% extends 'main.html' %}

{% block content %}
<div>
    {% for room in rooms %}
    <div>
        <span style="color : blue;">@{{room.host.username}}</span>
        <h2>{{room.id}}--<a href="{% url 'room' room.id %}">{{room.name}}</a></h2>
        <small>{{room.topic.name}}</small>
        <a href="{% url 'updateRoom' room.id %}">Edit</a>
        <a href="{% url 'deleteRoom' room.id %}">Delete</a>
    </div>
    <hr>
    {% endfor %}
</div>
{% endblock %}
